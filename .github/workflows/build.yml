name: Build APK

# Manual only: run it from the Actions tab when you want an APK.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the standard Flutter Android files (Gradle, icons, styles).
      # Files already in the repo (our manifest and MainActivity) are kept as they are.
      - name: Generate Android platform files
        run: flutter create --org com.vibe --project-name vibe_ai --platforms android .

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
