name: Build APK

# Manual only: run it from the Actions tab when you want an APK.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release type"
        type: choice
        options: [rc, stable]
        default: rc

# Needed to publish the APK as a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the standard Flutter Android files (Gradle, icons, styles).
      # Files already in the repo (our manifest and MainActivity) are kept as they are.
      - name: Generate Android platform files
        run: flutter create --org com.vibe --project-name vibe_ai --platforms android .

      # Built-in server (test): Termux's Node.js for arm64, repackaged as APK native libraries.
      - name: Bundle Node.js
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
          pip install --quiet --break-system-packages zstandard || true
          python3 scripts/bundle_node.py android/app/src/main/jniLibs/arm64-v8a

      # Built-in server: FreeLLMAPI production build packed into the app's assets.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Bundle FreeLLMAPI
        run: bash scripts/bundle_server.sh

      # Native libraries must be extracted on install so Android lets the app run Node.
      - name: Keep native libraries extracted
        run: |
          cat >> android/app/build.gradle.kts <<'EOF'

          android {
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
              // Android 8+: background server and process APIs need it.
              defaultConfig {
                  minSdk = 26
              }
          }
          EOF

      # Release signing from repo secrets (same names and alias as Vibe), so every new
      # APK installs over the previous one. Without the secrets it falls back to the debug key.
      - name: Release signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSPASS" ]; then
            echo "::warning::Signing secrets not set; this APK uses the debug key and won't update a release-signed install."
            exit 0
          fi
          echo "$KS" | base64 -d > android/app/release.jks
          cat >> android/app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  create("vibeRelease") {
                      storeFile = file("release.jks")
                      storePassword = System.getenv("KSPASS")
                      keyAlias = System.getenv("KSALIAS")?.takeIf { it.isNotBlank() } ?: "vibe"
                      keyPassword = System.getenv("KSPASS")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("vibeRelease")
                  }
              }
          }
          EOF

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        env:
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KSALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        # Build number = run number, so the app can tell which release is newer.
        run: >
          flutter build apk --release --target-platform android-arm64
          --build-name 0.1.${{ github.run_number }} --build-number ${{ github.run_number }}

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk vibe-ai-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-ai-apk
          path: vibe-ai-${{ github.run_number }}.apk

      # Each build becomes a GitHub Release; the app's "Check for updates" reads the latest one.
      # rc = release candidate (marked pre-release); stable = normal release.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}${{ inputs.channel == 'rc' && '-rc' || '' }}
          name: Vibe AI 0.1.${{ github.run_number }}${{ inputs.channel == 'rc' && ' RC' || '' }}
          files: vibe-ai-${{ github.run_number }}.apk
          prerelease: ${{ inputs.channel == 'rc' }}
          make_latest: ${{ inputs.channel == 'rc' && 'false' || 'true' }}
          body: |
            ${{ inputs.channel == 'rc' && 'Release candidate: please test before it becomes stable.' || 'Stable release.' }}

            Build ${{ github.run_number }} from commit ${{ github.sha }}.

            Changes since the last build:
            https://github.com/${{ github.repository }}/commits/${{ github.sha }}
