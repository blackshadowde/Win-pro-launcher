name: Build APK

# Manual only: run it from the Actions tab when you want an APK.
on:
  workflow_dispatch:

jobs:
  build:
    # Pinned: this image ships with the Android SDK preinstalled.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      # Selawik: Microsoft's open-source (OFL) font made to match Segoe.
      # Fetched at build time and bundled; never committed to the repo.
      - name: Fetch Selawik font
        run: |
          git clone --depth 1 https://github.com/microsoft/Selawik /tmp/selawik || exit 0
          mkdir -p app/src/main/res/font
          find /tmp/selawik -iname "*.ttf" | sort | while read -r f; do
            n=$(basename "$f" | tr 'A-Z' 'a-z')
            case "$n" in
              *semilight*|selawksl*) w=semilight ;;
              *semibold*|selawksb*) w=semibold ;;
              *light*|selawkl*) w=light ;;
              *bold*|selawkb*) w=bold ;;
              *) w=regular ;;
            esac
            [ -f "app/src/main/res/font/selawik_$w.ttf" ] || cp "$f" "app/src/main/res/font/selawik_$w.ttf"
          done
          ls -l app/src/main/res/font || true

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: start-launcher-apk
          path: app/build/outputs/apk/release/*.apk
